<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pratinjau Dokumen</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:13px/1.5 Arial,sans-serif;color:#5a4b51;background:#f3eeee}body{display:flex;flex-direction:column}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#fffafa;border-bottom:1px solid #e8caca;position:sticky;top:0;z-index:2}button,input,select,a{font:inherit;color:inherit}button,select,input{border:1px solid #dac7ca;border-radius:6px;background:white;min-height:31px}button{padding:4px 10px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:hover:enabled{background:#f7e8e8}input{width:45px;text-align:center;padding:4px}select{padding:4px;max-width:105px}a{margin-left:auto;text-decoration:none;font-size:11px;padding:5px 7px}a:hover{text-decoration:underline}#pages{white-space:nowrap;font-size:11px}#viewport{flex:1;overflow:auto;min-height:0;padding:14px;overscroll-behavior:contain}#canvas{display:block;margin:0 auto;background:white;box-shadow:0 3px 18px #5a4b5124}#message{padding:30px 20px;text-align:center;line-height:1.9}#message[hidden],canvas[hidden]{display:none}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}:focus-visible{outline:2px solid #a39193;outline-offset:2px}@media(max-width:420px){header{gap:6px;padding:8px}button{padding:4px 8px}select{max-width:85px}#viewport{padding:8px}a{font-size:10px}}
</style></head><body>
<header aria-label="Kontrol pratinjau PDF"><button id="prev" aria-label="Halaman sebelumnya" disabled>‹</button><label class="sr-only" for="page">Nomor halaman</label><input id="page" type="number" min="1" value="1" aria-label="Nomor halaman" disabled><span id="pages">/ …</span><button id="next" aria-label="Halaman berikutnya" disabled>›</button><label class="sr-only" for="zoom">Ukuran tampilan</label><select id="zoom" aria-label="Ukuran tampilan"><option value="fit">Paskan lebar</option><option value=".75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select><a id="download" download>Unduh PDF</a></header>
<main id="viewport"><p id="message" role="status" aria-live="polite">Memuat dokumen…</p><canvas id="canvas" aria-label="Halaman dokumen PDF" hidden></canvas></main>
<script type="module" src="pdf-viewer.mjs"></script></body></html>
